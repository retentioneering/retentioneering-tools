name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: js/package-lock.json

      - name: Install JS dependencies
        working-directory: js
        run: npm ci

      - name: Build JS
        run: |
          npm run build --prefix js/viz-core
          npm run build --prefix js/widget

      - name: Run JS tests
        run: npm test --prefix js/widget

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install matrix Python
        run: uv python install "$UV_PYTHON"

      - name: Install Python dependencies
        run: |
          uv sync --python "$UV_PYTHON"
          uv run python -c 'import os, sys; assert sys.version_info[:2] == tuple(map(int, os.environ["UV_PYTHON"].split(".")))'

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Install Chromium for widget rendering tests
        if: matrix.python-version == '3.12'
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Run widget rendering tests
        if: matrix.python-version == '3.12'
        run: uv run --with playwright pytest tests/browser -v

      - name: Execute experiment tutorials
        if: matrix.python-version == '3.12'
        run: |
          uv run --with nbclient --with nbformat --with nbconvert --with ipykernel python examples/experiments/execute_tutorial.py
          uv run --with nbclient --with nbformat --with nbconvert --with ipykernel python examples/experiments/execute_tutorial.py --lumeo

      - name: Upload executed experiment tutorials and diagnostics
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: experiment-tutorials-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
