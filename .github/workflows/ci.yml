name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # setup-uv@v3 has no python-version input, so without this uv falls
      # back to the runner's system interpreter (CPython 3.14 on the current
      # ubuntu-latest image, for which gensim has no wheel).
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: js/package-lock.json

      - name: Install JS dependencies
        working-directory: js
        run: npm ci

      - name: Build JS
        run: |
          npm run build --prefix js/viz-core
          npm run build --prefix js/widget

      - name: Run JS tests
        run: npm test --prefix js/widget

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        run: uv sync

      - name: Check the interpreter is the matrix Python
        run: >-
          uv run python -c "import sys;
          v = '%d.%d' % sys.version_info[:2];
          print('Python', v);
          assert v == '${{ matrix.python-version }}', v"

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Install Chromium for widget rendering tests
        if: matrix.python-version == '3.12'
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Run widget rendering tests
        if: matrix.python-version == '3.12'
        run: uv run --with playwright pytest tests/browser -v
