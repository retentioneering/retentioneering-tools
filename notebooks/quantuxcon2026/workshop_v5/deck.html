<script>
// Custom slide logic, kept out of slides.ipynb so the notebook's markdown stays
// plain (no Quarto attribute syntax). Colors and sizes live in custom.scss.
//
// Theme conventions, applied to every slide:
//   # Heading                    → section slide, background from --section-bg
//   ## Slide + ### Question      → centered question slide
//   ## 2.1 Title (nothing else)  → subsection divider
//   Question · Shape events · …  → workflow roadmap, **bold** steps highlighted
//   > blockquote                 → takeaway box (pure CSS, see custom.scss)
//
// Slide illustrations, applied only to the slide they are registered for in
// SLIDES below (by the id Quarto derives from the slide title). Each one adds
// a `slide-…` class to its slide, which custom.scss scopes its styles to.
(function () {
  var SLIDES = {
    "what-retentioneering-is": { cls: "slide-what", build: buildWhatGrid },
    "retentioneering-history": { cls: "slide-history", build: buildHistory },
    "questions-retentioneering-answers": { cls: "slide-why" },
    "in-this-workshop": { cls: "slide-workshop", build: buildWorkshopParts },
    "sequence-log-data": { cls: "slide-event-log-data", build: buildEventLogColumnGroups },
    "eventstream": { cls: "slide-eventstream", build: buildEventstreamSchemaFrames },
    // Styles only, no markup changes:
    "types-of-data-processors": { cls: "slide-data-processors", build: buildDataProcessorsTree },
    "funnels-the-traditional-view": { cls: "slide-funnel", build: buildFunnelBlindSpots },
    "transition-graph-count-adjacent-pairs": { cls: "slide-pairs", build: buildPairsLayout },
    "edge-weights": { cls: "slide-edge-weights" },
    "step-matrix-count-events-at-each-step": { cls: "slide-step-matrix", build: buildStepSpotlight },
    "tree-vs.-step-matrix": { cls: "slide-step-matrix", build: buildStepSpotlight },
    "step-matrix-centered-on-an-event": { cls: "slide-step-matrix", build: buildStepSpotlight },
    "step-matrix-one-row-per-event": { cls: "slide-step-matrix-demo", build: buildTreesAndMatrix },
    "step-matrix-diff-mode": { cls: "slide-widget-points", build: buildWidgetAndPoints },
    "diff-mode-two-segments-one-graph": { cls: "slide-graph-points", build: graphAndPoints(false) },
    "collapse_events-collapse-loops": { cls: "slide-path-beads", build: buildPathBeadsStep },
    "add_events-mark-a-position": { cls: "slide-path-beads", build: buildPathBeadsStep },
    "truncate_paths-cut-a-window-between-two-events": { cls: "slide-path-beads", build: buildPathBeadsStep },
    "truncate_paths-expand-your-horizons": { cls: "slide-path-beads", build: buildPathBeadsStep },
    "truncate_paths-set-borders-with-regex": { cls: "slide-path-beads", build: buildPathBeadsStep },
    "collapse_events-one-event-per-session": { cls: "slide-collapse-sessions" },
    "why-not-tree-based-diagrams": { cls: "slide-sunburst slide-journeys" },
    "taskboard-a-simple-task-tracker": { cls: "slide-taskboard-app" },
    "events-and-the-happy-path": { cls: "slide-taskboard-intro", build: buildTaskboardStageChips },
    "almost-every-path-is-unique": { cls: "slide-sunburst slide-journeys" },
    "the-transition-graph": { cls: "slide-graph-intro slide-step-matrix", build: buildSideBySide },
    "even-the-graph-is-tangled-on-real-data": { cls: "slide-graph-switch slide-stage-graph", build: buildGraphSwitcher },
    "make-each-session-a-single-event": { cls: "slide-visits-idea", build: buildVisitsIdea },
    "what-kind-of-session-was-it": { cls: "slide-cluster-table", build: buildSessionClusterSpots },
    "who-the-users-are-cluster-sequences-of-sessions": { cls: "slide-cluster-table", build: buildClusterTableLayout },
    "eight-session-types-instead-of-29-events": { cls: "slide-visits-graph", build: buildVisitsBeforeAfter },
    "what-it-looks-like-in-retentioneering-code": { cls: "slide-code-steps", build: buildCodeSteps },
    "start-a-local-server": { cls: "slide-mcp" },
    "ask-and-get-a-report": { cls: "slide-report", build: buildReportAsk },
    "what-it-looks-like-on-tree-diagrams": { cls: "slide-sunburst slide-tree-spot", build: buildTreeSpot },
  };

  var ROADMAP = "Question · Shape events · Look · Compare · Check · Claim";

  // ── Slide: About us ────────────────────────────────────────────────────────
  // `### Name` + photo + list, repeated → one card per person, in a row.
  function buildAboutUsCards(slide) {
    var row = document.createElement("div");
    row.className = "people";
    var card = null;
    Array.prototype.slice.call(slide.children).forEach(function (el) {
      if (el.tagName === "H3") {
        card = document.createElement("div");
        card.className = "person";
        row.appendChild(card);
      }
      if (card && !el.matches("aside")) card.appendChild(el);
    });
    slide.appendChild(row);
  }

  // ── Slide: UX research ─────────────────────────────────────────────────────
  // The table becomes a matrix of method cards: column and row headers are the
  // axes (`Axis: hint`), each body cell a card of comma-separated items. An item
  // `Text ← note` gets the note as a tag, shown on the next click.
  function buildUxResearchMatrix(slide) {
    var table = slide.querySelector("table");
    var head = table.querySelectorAll("thead th");

    function axisLabel(cls, text) {
      var div = document.createElement("div");
      var i = text.indexOf(":");
      div.className = cls;
      div.textContent = (i < 0 ? text : text.slice(0, i)).trim();
      if (i >= 0) {
        var hint = document.createElement("small");
        hint.textContent = text.slice(i + 1).trim();
        div.appendChild(hint);
      }
      return div;
    }

    function addTag(li) {
      var parts = li.innerHTML.split("←");
      if (parts.length < 2) return;
      li.innerHTML = parts[0].trim() + ' <span class="tag fragment"></span>';
      li.lastChild.textContent = parts.slice(1).join("←").trim();
    }

    var matrix = document.createElement("div");
    matrix.className = "matrix";
    matrix.style.setProperty("--cols", head.length - 1);
    matrix.appendChild(document.createElement("div"));
    for (var c = 1; c < head.length; c++) {
      matrix.appendChild(axisLabel("matrix-col col-" + c, head[c].textContent));
    }
    table.querySelectorAll("tbody tr").forEach(function (tr) {
      var cells = tr.children;
      matrix.appendChild(axisLabel("matrix-row", cells[0].textContent));
      for (var c = 1; c < cells.length; c++) {
        var card = document.createElement("div");
        card.className = "matrix-cell col-" + c;
        var ul = document.createElement("ul");
        cells[c].innerHTML.split(",").forEach(function (item) {
          var li = document.createElement("li");
          li.innerHTML = item.trim();
          ul.appendChild(li);
          addTag(li);
        });
        card.appendChild(ul);
        matrix.appendChild(card);
      }
    });
    table.replaceWith(matrix);
  }

  // ── Column frames (shared by Event-log data and Eventstream) ─────────────
  // A frame is drawn around a group of table columns, with a label underneath.
  // Optional columns: a group of only optional columns is framed dashed in the
  // "optional" color, an optional column inside a required group gets an inner
  // dashed frame. Frames are reveal.js fragments.

  function tableHeaders(table) {
    return Array.prototype.map.call(table.querySelectorAll("thead th"), function (th) {
      return th.textContent.trim();
    });
  }

  // Wrap the table in a positioned box the frames are laid out in.
  function wrapForColumnFrames(table) {
    var wrap = document.createElement("div");
    wrap.className = "columns-wrap";
    table.replaceWith(wrap);
    wrap.appendChild(table);
    return wrap;
  }

  // cols: [{index, optional}] — header indexes of the framed columns.
  function addColumnFrame(wrap, cols, label) {
    var idx = cols.map(function (c) { return c.index; });
    var optionalGroup = cols.every(function (c) { return c.optional; });
    var frame = document.createElement("div");
    frame.className = "frame fragment" + (optionalGroup ? " optional" : "");
    frame.dataset.first = Math.min.apply(null, idx);
    frame.dataset.last = Math.max.apply(null, idx);
    var caption = document.createElement("div");
    caption.className = "frame-label";
    caption.textContent = label;
    frame.appendChild(caption);
    cols.forEach(function (c) {
      if (!c.optional || optionalGroup) return;
      var inner = document.createElement("div");
      inner.className = "frame-inner";
      inner.dataset.col = c.index;
      frame.appendChild(inner);
    });
    wrap.appendChild(frame);
    return frame;
  }

  // Position the frames over their columns. Uses offset* (layout pixels, not
  // affected by reveal's scaling), so it only works on a displayed slide: run
  // on every slide change and resize.
  function layoutColumnFrames(slide) {
    if (!slide) return;
    slide.querySelectorAll(".columns-wrap").forEach(function (wrap) {
      var table = wrap.querySelector("table");
      var head = table.querySelectorAll("thead th");
      var body = table.querySelector("tbody");
      var top = table.offsetTop;
      var height = body.offsetTop + body.offsetHeight;
      var x = function (i) { return table.offsetLeft + head[i].offsetLeft; };
      var w = function (i) { return head[i].offsetWidth; };
      // Frames are inset by GAP so neighbouring ones don't touch; inner frames
      // by INNER from their column's edges.
      var GAP = 4, INNER = 6;
      wrap.querySelectorAll(".frame").forEach(function (frame) {
        var first = +frame.dataset.first, last = +frame.dataset.last;
        var left = x(first) + GAP;
        frame.style.left = left + "px";
        frame.style.top = top + "px";
        frame.style.width = x(last) + w(last) - GAP - left + "px";
        frame.style.height = height + "px";
        frame.querySelectorAll(".frame-inner").forEach(function (inner) {
          var c = +inner.dataset.col;
          inner.style.left = x(c) + INNER - left - 3 + "px";
          inner.style.width = w(c) - 2 * INNER + "px";
        });
      });
    });
  }

  // ── Slide: Event-log data ──────────────────────────────────────────────────
  // The list under the table, `- label: col, *col*`, becomes column frames,
  // one per click, in list order. *Italic* columns are optional.
  function buildEventLogColumnGroups(slide) {
    var table = slide.querySelector("table");
    var list = table.nextElementSibling;
    var caption = table.previousElementSibling;  // "Event log table", if any
    var headers = tableHeaders(table);
    var wrap = wrapForColumnFrames(table);
    if (caption && caption.tagName === "P") {  // goes right above the table
      caption.classList.add("table-caption");
      wrap.insertBefore(caption, table);
    }
    Array.prototype.forEach.call(list.children, function (li) {
      var i = li.textContent.indexOf(":");
      var cols = li.innerHTML.slice(li.innerHTML.indexOf(":") + 1).split(",").map(function (html) {
        var tmp = document.createElement("span");
        tmp.innerHTML = html;
        return { index: headers.indexOf(tmp.textContent.trim()), optional: /<em>/.test(html) };
      }).filter(function (c) {
        return c.index >= 0;
      });
      if (i < 0 || !cols.length) return;
      addColumnFrame(wrap, cols, li.textContent.slice(0, i).trim());
    });
    list.remove();
  }

  // ── Slide: Eventstream ─────────────────────────────────────────────────────
  // Each click on the schema code highlights one line (Quarto clones the code
  // block into one fragment per step); frame the columns that line names, on
  // the same click, with the schema key as the label. Only the current frame
  // shows, like the highlighted line. Segment and custom columns are optional.
  var OPTIONAL_SCHEMA_KEYS = ["segment_cols", "custom_cols"];

  function buildEventstreamSchemaFrames(slide) {
    var table = slide.querySelector("table");
    var headers = tableHeaders(table);
    var wrap = wrapForColumnFrames(table);
    slide.querySelectorAll("code.has-line-highlights.fragment").forEach(function (step) {
      var line = step.querySelector(".highlight-line");
      var m = line && line.textContent.match(/"(\w+)"\s*:(.*)/);
      if (!m) return;
      var optional = OPTIONAL_SCHEMA_KEYS.indexOf(m[1]) >= 0;
      var cols = (m[2].match(/"[^"]+"/g) || []).map(function (q) {
        return { index: headers.indexOf(q.slice(1, -1)), optional: optional };
      }).filter(function (c) {
        return c.index >= 0;
      });
      if (!cols.length) return;
      var frame = addColumnFrame(wrap, cols, m[1]);
      frame.classList.add("current-visible");
      frame.dataset.fragmentIndex = step.dataset.fragmentIndex;
    });

    // Put the two code blocks (read the CSV | the schema) side by side above
    // the table, so the whole slide fits and the highlighted schema line sits
    // right above its frame. Spacer paragraphs (`<br>`) are no longer needed.
    var cells = slide.querySelectorAll(":scope > .cell");
    if (cells.length === 2) {
      var row = document.createElement("div");
      row.className = "code-row";
      row.appendChild(cells[0].querySelector(".code-copy-outer-scaffold"));
      row.appendChild(cells[1].querySelector(".code-copy-outer-scaffold"));
      cells[0].insertBefore(row, cells[0].firstChild);
      cells[1].remove();
    }
    slide.querySelectorAll(":scope > p").forEach(function (p) {
      if (!p.textContent.trim() && p.querySelector("br")) p.remove();
    });
  }

  // ── Slide: Data accessor: Eventstream.df ───────────────────────────────────
  // On the first click, frame the technical columns Eventstream adds and show
  // the list under the table that explains them.
  var TECHNICAL_COLUMNS = ["event_type", "subindex", "index"];

  function buildStreamDfTechnicalFrame(slide) {
    var table = slide.querySelector("table");
    var headers = tableHeaders(table);
    var cols = TECHNICAL_COLUMNS.map(function (name) {
      return { index: headers.indexOf(name), optional: false };
    }).filter(function (c) {
      return c.index >= 0;
    });
    var frame = addColumnFrame(wrapForColumnFrames(table), cols, "added by Eventstream");
    frame.dataset.fragmentIndex = 0;
    var list = slide.querySelector(":scope > ul");
    if (list) {
      list.classList.add("fragment");
      list.dataset.fragmentIndex = 0;
    }
  }

  // ── Slides: collapse_events, truncate_paths, Anchors, add_events ──────────
  // The toy paths first show in full ("before"); on the next click, whatever
  // the processor removed fades out ("after"). The figure is a fragment that
  // stays visible: custom.scss only fades the dropped beads once it is shown.
  function buildPathBeadsStep(slide) {
    var figure = slide.querySelector(".path-beads");
    if (figure) figure.classList.add("fragment");
    return figure;
  }

  // ── Slide: Funnels: the traditional view ───────────────────────────────────
  // The list under the funnel figure ("what a funnel can't see") comes one item
  // per click; the current item lights up the path it names first ("D→B→E"),
  // matched against the rows' data-path (see syncFunnelSpots).
  var PATH_IN_TEXT = /[A-Za-z_]+(?:→[A-Za-z_]+)+/;

  function buildFunnelBlindSpots(slide) {
    slide.querySelectorAll(":scope > ul > li").forEach(function (li) {
      li.classList.add("fragment");
      var m = li.textContent.match(PATH_IN_TEXT);
      if (m) li.dataset.path = m[0];
    });
  }

  function syncFunnelSpots(slide) {
    if (!slide || !slide.classList.contains("slide-funnel")) return;
    var current = slide.querySelector("li.current-fragment");
    var path = current && current.dataset.path;
    slide.querySelectorAll(".path-row").forEach(function (row) {
      row.classList.toggle("spot", !!path && row.dataset.path === path);
    });
  }

  // ── Slide: Transition graph: count adjacent pairs ──────────────────────────
  // Paths and pair counts come as one figure (toy.pairs_figure, which also sets
  // up the per-click frames); the graph widget is the next cell's output. Put
  // it in as the third column.
  function buildPairsLayout(slide) {
    var layout = slide.querySelector(".pairs-layout");
    var iframe = slide.querySelector("iframe[srcdoc]");
    if (!layout || !iframe) return;
    var column = document.createElement("div");
    column.className = "pairs-graph";
    column.appendChild(iframe.closest(".cell-output-display") || iframe);
    layout.appendChild(column);
  }

  // The pair framed in the list (toy.pairs_figure's data-pair on its row) is
  // also spotlighted on the graph: its edge and its two nodes.
  function syncPairsSpot(slide) {
    if (!slide || !slide.classList.contains("slide-pairs")) return;
    var frame = slide.querySelector(".pair-frame.visible");
    var pair = frame ? frame.closest(".pair-row").dataset.pair.split("->") : null;
    var f = slide.querySelector(".pairs-graph iframe[srcdoc]");
    if (!f) return;
    whenGraphReady(f, function (cy) { spotEdge(cy, pair); });
  }

  // Spotlight edges (`[source, target]` pairs; spotEdge: one, or null for
  // none) on a graph: the edges and their ends in orange, the rest faded.
  function spotEdge(cy, pair) {
    spotEdges(cy, pair ? [pair] : []);
  }

  function spotEdges(cy, pairs) {
    if (!cy.scratch("spotStyle")) {
      cy.scratch("spotStyle", true);
      cy.style()
        .selector(".spot-dim").style({ opacity: 0.15 })
        .selector("node.spot-hit").style({
          "underlay-color": "#f97316", "underlay-opacity": 0.35, "underlay-padding": 10, "underlay-shape": "ellipse",
        })
        .selector("edge.spot-hit").style({
          "underlay-color": "#f97316", "underlay-opacity": 0.35, "underlay-padding": 5,
        })
        .update();
    }
    cy.elements().removeClass("spot-dim spot-hit");
    if (!pairs.length) return;
    var edges = cy.edges().filter(function (e) {
      return pairs.some(function (p) { return e.data("source") === p[0] && e.data("target") === p[1]; });
    });
    var on = edges.union(edges.connectedNodes());
    on.addClass("spot-hit");
    cy.elements().not(on).addClass("spot-dim");
  }

  // ── Slides: Step matrix: count events at each step, Tree vs. step matrix ──
  // Tables made by toy.py carry `data-spotlight="1,2,3"`: the steps that get a
  // click each. The k-th listed step gets a column frame (the shared column
  // frame machinery) shown only on click k; the tree SVG sets up its own.
  function buildStepSpotlight(slide) {
    slide.querySelectorAll("table[data-spotlight]").forEach(function (table) {
      var steps = table.dataset.spotlight.split(",").filter(Boolean);
      if (!steps.length) return;
      var headers = tableHeaders(table);
      var wrap = wrapForColumnFrames(table);
      steps.forEach(function (step, k) {
        var index = headers.indexOf(step.trim());
        if (index < 0) return;
        var frame = addColumnFrame(wrap, [{ index: index, optional: false }], "");
        frame.classList.add("current-visible");
        frame.dataset.fragmentIndex = k;
      });
    });
  }

  // ── Slide: Chaining data processors ────────────────────────────────────────
  // The code steps through the chain line by line; each step brings in the
  // figure column with the paths after that processor (column 0 is the source,
  // always shown).
  function buildChainingResult(slide) {
    var steps = slide.querySelectorAll("code.has-line-highlights.fragment");
    slide.querySelectorAll(".chain-col").forEach(function (col, k) {
      if (!k || !steps[k - 1]) return;
      col.classList.add("fragment");
      col.dataset.fragmentIndex = steps[k - 1].dataset.fragmentIndex;
    });
  }

  // ── Slide: Path patterns ───────────────────────────────────────────────────
  // `### Syntax` + list and `### Examples` + list become two columns; the
  // examples column appears on the next click. Anything after the second list
  // (the closing note) stays below, full width, and comes with the examples.
  function buildPathPatternsColumns(slide) {
    var row = document.createElement("div");
    row.className = "pattern-columns";
    var column = null;
    var columns = [];
    Array.prototype.slice.call(slide.children).forEach(function (el) {
      if (el.tagName === "H3") {
        column = document.createElement("div");
        column.className = "pattern-column";
        columns.push(column);
        row.appendChild(column);
      }
      if (!column || el.matches("aside")) return;
      if (el.tagName === "H3" || el.tagName === "UL") {
        column.appendChild(el);
      } else if (columns.length > 1) {
        el.classList.add("fragment");
        el.dataset.fragmentIndex = 0;
      }
    });
    var title = slide.querySelector(":scope > h2");
    title.insertAdjacentElement("afterend", row);
    if (columns[1]) {
      columns[1].classList.add("fragment");
      columns[1].dataset.fragmentIndex = 0;
    }
  }

  // ── Slide: Types of data processors ────────────────────────────────────────
  // The nested list becomes a tree: the single top item is the root, its
  // sub-items the branches (cards side by side), their sub-items the leaves.
  function buildDataProcessorsTree(slide) {
    var ul = slide.querySelector(":scope > ul");
    var root = ul && ul.children.length === 1 && ul.firstElementChild;
    var branchList = root && root.querySelector(":scope > ul");
    if (!branchList) return;

    // An item's own text, without its nested list.
    function ownText(li) {
      var copy = li.cloneNode(true);
      copy.querySelectorAll("ul, ol").forEach(function (l) { l.remove(); });
      return copy.textContent.trim();
    }

    var tree = document.createElement("div");
    tree.className = "tree";
    tree.style.setProperty("--branches", branchList.children.length);
    var rootBox = document.createElement("div");
    rootBox.className = "tree-root";
    rootBox.textContent = ownText(root);
    var branches = document.createElement("div");
    branches.className = "tree-branches";
    Array.prototype.forEach.call(branchList.children, function (li) {
      var card = document.createElement("div");
      card.className = "tree-branch";
      var title = document.createElement("div");
      title.className = "tree-title";
      title.textContent = ownText(li);
      card.appendChild(title);
      var leaves = li.querySelector(":scope > ul, :scope > ol");
      if (leaves) card.appendChild(leaves);
      branches.appendChild(card);
    });
    tree.appendChild(rootBox);
    tree.appendChild(branches);
    ul.replaceWith(tree);
  }

  // ── Slide: Why event-log analysis is challenging ──────────────────────────
  // The numbered list becomes a stepper: items on the left, their sub-lists
  // stacked on the right. Item k and sub-list k share a fragment index, so each
  // click highlights the next item (only while current) and swaps in its
  // sub-list.
  function buildChallengesStepper(slide) {
    var ol = slide.querySelector(":scope > ol");
    var stepper = document.createElement("div");
    stepper.className = "stepper";
    var details = document.createElement("div");
    details.className = "stepper-details";
    Array.prototype.forEach.call(ol.children, function (li, i) {
      var sub = li.querySelector(":scope > ul, :scope > ol");
      li.classList.add("fragment", "stepper-item");
      li.dataset.fragmentIndex = i;
      if (!sub) return;
      sub.classList.add("fragment", "current-visible");
      sub.dataset.fragmentIndex = i;
      details.appendChild(sub);
    });
    ol.replaceWith(stepper);
    stepper.appendChild(ol);
    stepper.appendChild(details);
  }

  // ── Slide: Events and the happy path ──────────────────────────
  // Each table column is a stage; its events become chips in the stage's color
  // (custom.scss), and the happy path's events take the color of their column.
  function buildTaskboardStageChips(slide) {
    var stageOf = {};
    slide.querySelectorAll("tbody td").forEach(function (td) {
      var code = td.querySelector("code");
      if (!code) return;
      code.className = "chip stage-" + td.cellIndex;
      stageOf[code.textContent] = td.cellIndex;
    });
    slide.querySelectorAll(":scope > p code").forEach(function (code) {
      if (code.textContent in stageOf) code.className = "chip stage-" + stageOf[code.textContent];
    });
  }

  // ── Slides: What kind of visit was it? / Who are the users? / Who is Timeline for? ─
  // The cluster table on the left, a line per cluster on the right; the names
  // become pills, in their stage's color where they have one (custom.scss).
  //
  // The widget's value columns have a fixed width; here they size to their
  // content, so all the clusters fit in two thirds of the slide.
  var NARROW_TABLE_CSS =
    "td, th { width: auto !important; min-width: 0 !important; max-width: none !important; " +
    "padding-left: 4px !important; padding-right: 4px !important; } " +
    "tr > :first-child { width: 104px !important; min-width: 104px !important; max-width: 104px !important; }";

  function buildClusterTableLayout(slide) {
    var iframe = slide.querySelector("iframe[srcdoc]");
    iframe.dataset.widgetCss = NARROW_TABLE_CSS;
    var widget = iframe.closest(".cell");
    var list = slide.querySelector(":scope > ul");
    var layout = document.createElement("div");
    layout.className = "cluster-table-layout";
    widget.before(layout);
    layout.appendChild(widget);
    layout.appendChild(list);
    list.querySelectorAll("code").forEach(function (code) {
      code.classList.add("chip");
      code.dataset.visit = code.textContent;
    });
  }

  // ── Slide: What kind of session was it? ─────────────────────────────────
  // The cluster table, then two clicks: a frame around one cluster's column,
  // then frames around the rows of the events that make it. The table is
  // inside the widget's iframe, so the frames are drawn in there (over the
  // table, clipped to its scroll box) whenever a click or a reload changes it.
  var CLUSTER_SPOTS = [
    { column: "teamwork" },
    { rows: ["accept_invite", "assign_task", "comment", "mention"] },
  ];

  function buildSessionClusterSpots(slide) {
    buildClusterTableLayout(slide);
    CLUSTER_SPOTS.forEach(function (spot, k) {
      var marker = document.createElement("span");
      marker.className = "fragment cluster-spot";
      marker.dataset.fragmentIndex = k;
      slide.appendChild(marker);
    });
    var f = slide.querySelector("iframe[srcdoc]");
    f.addEventListener("load", function () { syncClusterSpots(slide); });
  }

  function syncClusterSpots(slide) {
    var markers = slide && slide.querySelectorAll(".cluster-spot");
    if (!markers || !markers.length) return;
    var f = slide.querySelector("iframe[srcdoc]");
    var on = Array.prototype.map.call(markers, function (m) { return m.classList.contains("visible"); });
    var tries = 0;
    (function draw() {
      var doc = f.contentDocument;
      var table = doc && !f.dataset.loading && doc.querySelector("table");
      if (!table || !table.rows.length) {
        if (++tries < 100) setTimeout(draw, 100);
        return;
      }
      doc.querySelectorAll(".deck-spot").forEach(function (el) { el.remove(); });
      var win = doc.defaultView;
      // The table's scroll box: frames don't reach past it.
      var clip = table.getBoundingClientRect();
      for (var el = table.parentElement; el && el !== doc.body; el = el.parentElement) {
        var oy = win.getComputedStyle(el).overflowY;
        if (oy === "auto" || oy === "scroll" || oy === "hidden") { clip = el.getBoundingClientRect(); break; }
      }
      function frame(cellsToFrame) {
        if (!cellsToFrame.length) return;
        var r = { left: 1e9, top: 1e9, right: -1e9, bottom: -1e9 };
        cellsToFrame.forEach(function (c) {
          var b = c.getBoundingClientRect();
          r.left = Math.min(r.left, b.left); r.top = Math.min(r.top, b.top);
          r.right = Math.max(r.right, b.right); r.bottom = Math.max(r.bottom, b.bottom);
        });
        r.top = Math.max(r.top, clip.top); r.bottom = Math.min(r.bottom, clip.bottom);
        if (r.bottom <= r.top) return;
        var box = doc.createElement("div");
        box.className = "deck-spot";
        box.style.cssText = "position:absolute;pointer-events:none;z-index:50;box-sizing:border-box;" +
          "border:4px solid #111827;border-radius:4px;" +
          "box-shadow:0 0 0 2px #fff, inset 0 0 0 2px #fff;" +
          "left:" + (r.left + win.scrollX - 1) + "px;top:" + (r.top + win.scrollY - 1) + "px;" +
          "width:" + (r.right - r.left + 2) + "px;height:" + (r.bottom - r.top + 2) + "px;";
        doc.body.appendChild(box);
      }
      var rows = Array.prototype.slice.call(table.rows);
      var label = function (tr) { return tr.cells[0] ? tr.cells[0].textContent.trim() : ""; };
      CLUSTER_SPOTS.forEach(function (spot, k) {
        if (!on[k]) return;
        if (spot.column) {
          var head = rows.find(function (tr) {
            return Array.prototype.some.call(tr.cells, function (c) { return c.textContent.trim() === spot.column; });
          });
          if (!head) return;
          var col = Array.prototype.findIndex.call(head.cells, function (c) { return c.textContent.trim() === spot.column; });
          frame(rows.map(function (tr) { return tr.cells.length === head.cells.length ? tr.cells[col] : null; })
            .filter(Boolean));
        }
        (spot.rows || []).forEach(function (name) {
          var tr = rows.find(function (tr) { return label(tr) === name; });
          if (tr) frame(Array.prototype.slice.call(tr.cells));
        });
      });
    })();
  }

  // ── Slide: What it looks like in Retentioneering code ─────────────────────
  // The code on the left, what it does on the right: each highlight step of
  // the code (`#| code-line-numbers`, a fragment per step, made by Quarto's
  // line-highlight plugin) adds the point about it, in the same fragment,
  // under the points before.
  function buildCodeSteps(slide) {
    var cell = slide.querySelector(":scope > .cell");
    var list = slide.querySelector(":scope > ul");
    var layout = document.createElement("div");
    layout.className = "code-steps-layout";
    cell.before(layout);
    layout.appendChild(cell);
    layout.appendChild(list);
    cell.querySelectorAll("pre code.fragment").forEach(function (step, i) {
      step.dataset.fragmentIndex = i;
    });
    Array.prototype.forEach.call(list.children, function (li, i) {
      li.classList.add("fragment");
      li.dataset.fragmentIndex = i;
    });
  }

  // ── Slide: Step matrix: diff mode ─────────────────────────────────────────
  // The code and its widget on the left, the points on the right.
  // Diff mode colors the first group red, the second blue; so do the slides'
  // **bold** group names.
  var DIFF_GROUPS = { invited: "diff-1", organic: "diff-2" };

  function colorDiffGroups(slide) {
    slide.querySelectorAll("li strong").forEach(function (b) {
      var cls = DIFF_GROUPS[b.textContent.trim().toLowerCase()];
      if (cls) b.classList.add("diff-group", cls);
    });
  }

  function buildWidgetAndPoints(slide) {
    colorDiffGroups(slide);
    slide.querySelectorAll("iframe[srcdoc]").forEach(tightWidget);
    var cells = slide.querySelectorAll(":scope > .cell");
    var list = slide.querySelector(":scope > ul");
    var layout = document.createElement("div");
    layout.className = "widget-points-layout";
    cells[0].before(layout);
    var left = document.createElement("div");
    left.className = "widget-points-main";
    layout.appendChild(left);
    cells.forEach(function (cell) { left.appendChild(cell); });
    layout.appendChild(list);
  }

  // ── Slide: In this workshop ───────────────────────────────────────────────
  // A card per part, one per click: the point, and under it its illustration
  // (the k-th .part-fig of the cell's output).
  function buildWorkshopParts(slide) {
    var list = slide.querySelector(":scope > ul");
    var figs = slide.querySelectorAll(".part-fig");
    var cards = document.createElement("div");
    cards.className = "part-cards";
    Array.prototype.forEach.call(list.children, function (li, k) {
      var card = document.createElement("div");
      card.className = "part-card fragment";
      card.dataset.fragmentIndex = k;
      var text = document.createElement("div");
      text.className = "part-text";
      text.innerHTML = li.innerHTML;
      card.appendChild(text);
      if (figs[k]) card.appendChild(figs[k]);
      cards.appendChild(card);
    });
    list.replaceWith(cards);
    var cell = slide.querySelector(":scope > .cell");
    if (cell) cell.remove();
  }

  // ── Slide: Step matrix: one row per event ────────────────────────────────
  // The code on top; under it, the Part 1 tree diagrams (small) on the left,
  // the step matrix of the same users on the right.
  function buildTreesAndMatrix(slide) {
    var cells = slide.querySelectorAll(":scope > .cell");
    var row = document.createElement("div");
    row.className = "trees-matrix";
    cells[1].before(row);
    row.appendChild(cells[1]);
    row.appendChild(cells[2]);
  }

  // ── Slide: Ask, and get a report ──────────────────────────────────────────
  // The question across the slide; under it, the points on the left, the
  // report on the right.
  function buildReportAsk(slide) {
    var cell = slide.querySelector(":scope > .cell");
    var layout = document.createElement("div");
    layout.className = "report-ask-layout";
    var text = document.createElement("div");
    text.className = "report-ask-text";
    slide.querySelectorAll(":scope > ul").forEach(function (el) {
      text.appendChild(el);
    });
    cell.before(layout);
    layout.appendChild(text);
    layout.appendChild(cell);
  }

  // ── Static transition graphs: reaching into the widget ─────────────────────
  // A static widget is a same-origin iframe, and the widget keeps its
  // Cytoscape instance on the graph container's parent as `__cy`. reloadWidget
  // reloads an iframe (to refit it, see refitWidgets); whenGraphReady runs `fn`
  // with the graph once the (re)loaded widget has drawn it.
  function reloadWidget(f) {
    f.dataset.refitted = "1";
    f.dataset.loading = "1";
    if (!f.dataset.watched) {
      f.dataset.watched = "1";
      f.addEventListener("load", function () { delete f.dataset.loading; });
    }
    f.srcdoc = withPixelRatio(f.srcdoc, f.dataset.widgetCss);
  }

  function findCy(f) {
    var doc = f.contentDocument;
    if (!doc || f.dataset.loading) return null;
    var els = doc.querySelectorAll("div");
    for (var i = 0; i < els.length; i++) if (els[i].__cy) return els[i].__cy;
    return null;
  }

  function whenGraphReady(f, fn) {
    var tries = 0;
    (function poll() {
      var cy = findCy(f);
      if (cy && !cy.destroyed() && cy.nodes().length) { setTimeout(function () { fn(cy); }, 150); return; }
      if (++tries < 150) setTimeout(poll, 100);
    })();
  }

  // ── Slides: Even the transition graph is tangled / Eight visit types ──────
  // stage_graph() (toy.py) places the events stage by stage and leaves a
  // {stage: [events]} map next to the widget; on the first click each stage
  // gets a frame around its nodes, labeled in its color, redrawn whenever the
  // graph is panned or zoomed.
  function buildStageFrames(slide) {
    slide.querySelectorAll("script.stage-groups").forEach(function (script) {
      var layer = stageFramesLayer(script);
      if (layer) layer.classList.add("fragment");
    });
  }

  // The frames for one stage_graph() output (its script tag): a layer over
  // the widget, filled in once the graph is ready. Returns the layer (null if
  // the script has no widget next to it).
  function stageFramesLayer(script) {
    var cell = script.closest(".cell");
    var f = cell && cell.querySelector("iframe[srcdoc]");
    if (!f) return null;
    var groups = JSON.parse(script.textContent);
    var host = f.parentElement;
    host.classList.add("stage-frames-host");
    var layer = document.createElement("div");
    layer.className = "stage-frames";
    host.appendChild(layer);
    f.addEventListener("load", function () {
      whenGraphReady(f, function (cy) {
        function redraw() {
          var box = cy.container().getBoundingClientRect();
          layer.innerHTML = "";
          Object.keys(groups).forEach(function (stage) {
            if (stage === "path_start" || stage === "path_end") return;
            var nodes = cy.collection();
            groups[stage].forEach(function (id) { nodes = nodes.union(cy.getElementById(id)); });
            if (!nodes.length || groups[stage].length < 2) return;
            var bb = nodes.renderedBoundingBox({ includeLabels: true });
            var frame = document.createElement("div");
            frame.className = "stage-frame stage-" + stage;
            frame.style.left = f.offsetLeft + box.left + bb.x1 - 8 + "px";
            frame.style.top = f.offsetTop + box.top + bb.y1 - 8 + "px";
            frame.style.width = bb.w + 16 + "px";
            frame.style.height = bb.h + 16 + "px";
            frame.innerHTML = "<span>" + stage + "</span>";
            layer.appendChild(frame);
          });
          // A label that lands on one before it goes to its frame's bottom.
          var placed = [];
          layer.querySelectorAll(".stage-frame > span").forEach(function (label) {
            var r = label.getBoundingClientRect();
            var hit = placed.some(function (p) {
              return r.left < p.right && p.left < r.right && r.top < p.bottom && p.top < r.bottom;
            });
            if (hit) {
              label.style.top = "auto";
              label.style.bottom = "-0.75em";
              r = label.getBoundingClientRect();
            }
            placed.push(r);
          });
        }
        redraw();
        cy.on("viewport position", redraw);
      });
    });
    return layer;
  }

  // The visits graph on the left; on the right, one story per click (the
  // stories pile up, the current one is highlighted on the graph). A story's
  // `names` become pills in their stage's color (custom.scss), and the graph
  // dims everything but those nodes and the edges the story walks: `a` → `b`,
  // or, for an arrow not right after a name, from the story's first name. The
  // last click replaces the stories with the raw event graph (the slide's
  // second widget), captioned by the list's last item.
  function buildVisitsBeforeAfter(slide) {
    var cells = slide.querySelectorAll(":scope > .cell");
    var list = slide.querySelector(":scope > ul");
    var items = Array.prototype.slice.call(list.children);
    var caption = items.pop();
    var layout = document.createElement("div");
    layout.className = "visits-layout";
    cells[0].before(layout);
    layout.appendChild(cells[0]);
    var side = document.createElement("div");
    side.className = "visits-side";
    layout.appendChild(side);
    side.appendChild(list);
    side.appendChild(cells[1]);
    items.forEach(function (li, i) {
      li.classList.add("fragment", "story");
      li.dataset.fragmentIndex = i;
      li.querySelectorAll("code").forEach(function (code) {
        code.classList.add("chip");
        code.dataset.visit = code.textContent;
      });
    });
    list.classList.add("fragment", "fade-out");
    list.dataset.fragmentIndex = items.length;
    cells[1].classList.add("fragment", "graph-before");
    cells[1].dataset.fragmentIndex = items.length;
    var p = document.createElement("p");
    p.className = "graph-caption";
    p.innerHTML = caption.innerHTML;
    caption.remove();
    cells[1].appendChild(p);
    var after = document.createElement("p");
    after.className = "graph-caption fragment";
    after.dataset.fragmentIndex = items.length;
    after.textContent = "After: the same paths, session by session";
    cells[0].appendChild(after);
  }

  function storyWalk(li) {
    var names = [], edges = [], first = null, last = null, afterName = false;
    li.childNodes.forEach(function (n) {
      if (n.nodeName === "CODE") {
        var name = n.textContent;
        if (first === null) first = name;
        if (last && last.pending) edges.push([last.from, name]);
        names.push(name);
        last = { name: name };
        afterName = true;
        return;
      }
      var text = n.textContent;
      var arrow = text.indexOf("→");
      if (arrow >= 0) {
        var from = afterName && !text.slice(0, arrow).trim() ? last.name : first;
        if (/\bany\b/i.test(text.slice(0, arrow))) from = "*";  // every edge in
        last = { name: last && last.name, pending: true, from: from };
      }
      if (text.trim()) afterName = false;
    });
    return { names: names, edges: edges };
  }

  function highlightStory(cy, li) {
    if (!cy.scratch("storyStyle")) {
      cy.scratch("storyStyle", true);
      cy.style()
        .selector(".story-dim").style({ opacity: 0.12 })
        .selector("node.story-on").style({
          "underlay-color": "#f97316", "underlay-opacity": 0.35, "underlay-padding": 10, "underlay-shape": "ellipse",
        })
        .selector("edge.story-on").style({
          "underlay-color": "#f97316", "underlay-opacity": 0.35, "underlay-padding": 5,
        })
        .update();
    }
    cy.elements().removeClass("story-dim story-on");
    if (!li) return;
    var walk = storyWalk(li);
    var on = cy.collection();
    walk.names.forEach(function (name) { on = on.union(cy.getElementById(name)); });
    walk.edges.forEach(function (e) {
      on = on.union(cy.edges().filter(function (edge) {
        return (e[0] === "*" || edge.data("source") === e[0]) && edge.data("target") === e[1];
      }));
    });
    on = on.union(on.edges().connectedNodes());
    cy.elements().not(on).addClass("story-dim");
    on.addClass("story-on");
    return on;
  }

  // Called on every slide and fragment change: zoom the visits graph to fit
  // its half of the slide, and highlight the latest story shown.
  function syncVisitsSlide(slide) {
    if (!slide || !slide.classList.contains("slide-visits-graph")) return;
    var f = slide.querySelector(".visits-layout > .cell iframe[srcdoc]");
    var story = null;
    slide.querySelectorAll("li.story").forEach(function (li) {
      li.classList.remove("story-current");
      if (li.classList.contains("visible")) story = li;
    });
    // With the raw graph up (the last click), the stories are over.
    var before = slide.querySelector(".graph-before");
    if (before && before.classList.contains("visible")) story = null;
    if (story) story.classList.add("story-current");
    whenGraphReady(f, function (cy) {
      if (!cy.scratch("fitted")) {
        cy.scratch("fitted", true);
        cy.fit(undefined, 20);
      }
      highlightStory(cy, story);
    });
  }

  function addTitlePhotos() {
    document.querySelectorAll("#title-slide .quarto-title-author").forEach(function (author) {
      var name = author.querySelector(".quarto-title-author-name");
      if (!name || author.querySelector(".author-photo")) return;
      var key = name.textContent.trim();
      if (AUTHOR_PHOTOS[key]) {
        var img = document.createElement("img");
        img.className = "author-photo";
        img.alt = key;
        img.src = AUTHOR_PHOTOS[key];
        author.prepend(img);
      }
      var role = document.createElement("div");
      role.className = "author-role";
      role.textContent = "Co-founder of Retentioneering";
      name.after(role);
    });
  }

  // ── Slide: What Retentioneering is ────────────────────────────────────────
  // Four quadrants: the event log top left, the three tools it feeds (the
  // slide's next three widgets) in the others, an arrow from the log to each.
  var WHAT_TOOLS = ["Transition graph", "Step matrix", "Cluster analysis"];
  var ARROW_SVG =
    '<svg viewBox="0 0 44 20" aria-hidden="true"><path d="M2 10 H38 M30 3 L40 10 L30 17"/></svg>';

  // A static widget's page puts a 24px margin and a grey background around
  // the widget; drop them, and the iframe's room for them.
  var TIGHT_WIDGET_CSS =
    "body { background: transparent !important; } #retentioneering-root { margin: 0 !important; }";

  function tightWidget(f) {
    f.dataset.widgetCss = (f.dataset.widgetCss || "") + TIGHT_WIDGET_CSS;
    var h = parseFloat(f.style.height);
    if (h) f.style.height = h - 48 + "px";
    var box = f.closest(".cell-output-display");
    if (box) box.classList.add("tight-widget");
  }

  // Hide a widget's controls: for every button, its outermost wrapper that
  // doesn't hold `keep` (the chart).
  function hideWidgetChrome(doc, keep) {
    doc.querySelectorAll("button").forEach(function (el) {
      if (keep.contains(el)) return;
      while (el.parentElement && !el.parentElement.contains(keep)) el = el.parentElement;
      el.style.visibility = "hidden";
    });
  }

  function buildWhatGrid(slide) {
    var cells = slide.querySelectorAll(":scope > .cell");
    if (cells.length < 4) throw new Error("expected the log and three widgets");
    var grid = document.createElement("div");
    grid.className = "what-grid";
    cells[0].before(grid);
    Array.prototype.forEach.call(cells, function (cell, i) {
      cell.classList.add("what-q", "what-q" + i);
      if (i) {
        var label = document.createElement("div");
        label.className = "what-tool";
        label.textContent = WHAT_TOOLS[i - 1];
        cell.prepend(label);
      }
      grid.appendChild(cell);
    });
    // Small as they are here, the widgets show only their chart: no search,
    // filter or sidebar buttons, no margin around it.
    Array.prototype.slice.call(cells, 1).forEach(function (cell) {
      var f = cell.querySelector("iframe[srcdoc]");
      if (!f) return;
      tightWidget(f);
      f.addEventListener("load", function () {
        if (cell.classList.contains("what-q1")) {
          whenGraphReady(f, function (cy) {
            hideWidgetChrome(f.contentDocument, cy.container());
            // The whole graph, after the widget's own fit, which leaves room
            // for the controls.
            setTimeout(function () { cy.fit(undefined, 6); }, 600);
          });
          return;
        }
        var tries = 0;
        (function wait() {
          var table = f.contentDocument && f.contentDocument.querySelector("table");
          if (table) hideWidgetChrome(f.contentDocument, table);
          else if (++tries < 100) setTimeout(wait, 100);
        })();
      });
    });
    ["right", "down", "diag"].forEach(function (dir) {
      var arrow = document.createElement("div");
      arrow.className = "what-arrow what-arrow-" + dir;
      arrow.innerHTML = ARROW_SVG;
      grid.appendChild(arrow);
    });
  }

  // ── Slide: Retentioneering history ───────────────────────────────────────────────
  // The logo, the years and their caption (the paragraphs before the list)
  // become an emblem on the left of the list.
  function buildHistory(slide) {
    var list = slide.querySelector(":scope > ul");
    var paras = Array.prototype.slice.call(slide.querySelectorAll(":scope > p"))
      .filter(function (p) { return !p.querySelector("img"); });
    var emblem = document.createElement("div");
    emblem.className = "history-emblem";
    var layout = document.createElement("div");
    layout.className = "history-layout";
    list.before(layout);
    layout.appendChild(emblem);
    layout.appendChild(list);
    var img = slide.querySelector("img");
    var figure = img && (img.closest(".quarto-figure") || img.closest("p") || img);
    if (figure) emblem.appendChild(figure);
    paras.slice(1, 3).forEach(function (p) { emblem.appendChild(p); });
    paras[0].classList.add("history-lead");
  }

  // ── Slide: The transition graph ───────────────────────────────────────────
  // The slide's figures side by side (a tree, the graph of the same paths),
  // the points under them.
  // The last point is a click that spotlights its event (its first `code`)
  // everywhere: in the paths and the tree, every occurrence with the steps
  // out of it and the events they lead to; in the graph, its one node with
  // the transitions out of it.
  function buildSideBySide(slide) {
    var cells = slide.querySelectorAll(":scope > .cell");
    var row = document.createElement("div");
    row.className = "side-by-side";
    cells[0].before(row);
    cells.forEach(function (cell) { row.appendChild(cell); });
    var spot = slide.querySelector(":scope > ul > li:last-child");
    var code = spot && spot.querySelector("code");
    if (!code) return;
    spot.classList.add("fragment", "spot-point");
    spot.dataset.node = code.textContent;
  }

  function syncTreeGraphSpot(slide) {
    var spot = slide && slide.querySelector("li.spot-point");
    if (!spot) return;
    var name = spot.dataset.node;
    var on = spot.classList.contains("visible");
    slide.querySelectorAll("svg.prefix-tree, .short-paths").forEach(function (svg) {
      svg.classList.toggle("spot-on", on);
      svg.querySelectorAll("[data-event], [data-from]").forEach(function (el) {
        var hit = el.dataset.event === name || el.dataset.from === name;
        var next = el.dataset.parent === name;
        el.classList.toggle("spot-hit", on && hit);
        el.classList.toggle("spot-next", on && next && !hit);
      });
    });
    var f = slide.querySelector(".side-by-side iframe[srcdoc]");
    if (!f) return;
    whenGraphReady(f, function (cy) {
      if (!cy.scratch("spotStyle")) {
        cy.scratch("spotStyle", true);
        cy.style()
          .selector(".spot-dim").style({ opacity: 0.15 })
          .selector("node.spot-hit").style({
            "underlay-color": "#f97316", "underlay-opacity": 0.35, "underlay-padding": 10, "underlay-shape": "ellipse",
          })
          .selector("edge.spot-hit").style({
            "underlay-color": "#f97316", "underlay-opacity": 0.35, "underlay-padding": 5,
          })
          .update();
      }
      cy.elements().removeClass("spot-dim spot-hit");
      if (!on) return;
      var node = cy.getElementById(name);
      var edges = node.outgoers("edge");
      node.union(edges).addClass("spot-hit");
      cy.elements().not(node.union(edges).union(edges.connectedNodes())).addClass("spot-dim");
    });
  }

  // ── Slide: Even the graph is tangled on real data ─────────────────────────
  // The first paragraph on top. Under it, two graphs side by side: on the
  // left, always the graph as it is; on the right, stacked in one place, what
  // each operation makes of it. The text goes underneath. Each point of the
  // list is a click that brings its own graph up on the right (the lead-in
  // comes with the first one). With the grouped graph (one node per group:
  // stage_graph's groups all of one event, named after it), the left graph
  // shows those groups framed. A paragraph after the list is the last click.
  function buildGraphSwitcher(slide) {
    var cells = Array.prototype.slice.call(slide.querySelectorAll(":scope > .cell"));
    var list = slide.querySelector(":scope > ul");
    var intro = slide.querySelector(":scope > p");
    if (!list) throw new Error("no list of points (a blank line before it?)");
    var top = document.createElement("div");
    top.className = "graph-switch-top";
    cells[0].before(top);
    if (intro) {
      top.before(intro);
      intro.classList.add("graph-switch-intro");
    }
    var before = document.createElement("div");
    before.className = "graph-switch-before";
    var stack = document.createElement("div");
    stack.className = "graph-switch-stack";
    top.appendChild(before);
    top.appendChild(stack);
    var text = document.createElement("div");
    text.className = "graph-switch-text";
    top.after(text);
    // Everything after the intro, in order: the lead-in, the list, the close.
    var leadIn = [], close = [];
    for (var el = list.previousElementSibling; el && el !== intro; el = el.previousElementSibling) {
      if (el.tagName === "P") leadIn.unshift(el);
    }
    var question = null;
    for (el = list.nextElementSibling; el; el = el.nextElementSibling) {
      if (el.tagName === "P") close.push(el);
      if (el.tagName === "H3") question = el;
    }
    leadIn.concat([list], close).forEach(function (node) { text.appendChild(node); });
    before.appendChild(cells[0]);
    var points = Array.prototype.slice.call(list.children);
    var framesAt = null;
    cells.slice(1).forEach(function (cell, i) {
      stack.appendChild(cell);
      cell.classList.add("fragment", "graph-switch-next");
      cell.dataset.fragmentIndex = i;
      if (points[i]) {
        points[i].classList.add("fragment", "switch-point");
        points[i].dataset.fragmentIndex = i;
      }
      if (isGroupedGraph(cell)) framesAt = i;
    });
    leadIn.forEach(function (p) {
      p.classList.add("fragment");
      p.dataset.fragmentIndex = 0;
    });
    var last = cells.length - 1;
    close.forEach(function (p) {
      p.classList.add("fragment", "graph-switch-close");
      p.dataset.fragmentIndex = last;
    });
    // The question (`### …` after the list): one more click, in large type
    // over the text.
    if (question) {
      question.classList.add("fragment", "graph-switch-question");
      question.dataset.fragmentIndex = last + 1;
      text.appendChild(question);
    }
    // The left graph's groups, framed while the grouped graph is on.
    var script = cells[0].querySelector("script.stage-groups");
    var layer = framesAt !== null && script && stageFramesLayer(script);
    if (layer) {
      var shown = document.createElement("div");
      shown.className = "stage-frames-window fragment fade-out";
      shown.dataset.fragmentIndex = framesAt + 1;
      layer.before(shown);
      shown.appendChild(layer);
      layer.classList.add("fragment");
      layer.dataset.fragmentIndex = framesAt;
    }
  }

  // A graph whose every node is a group of its own (the events renamed to
  // their groups).
  function isGroupedGraph(cell) {
    var script = cell.querySelector("script.stage-groups");
    if (!script) return false;
    var groups = JSON.parse(script.textContent);
    var names = Object.keys(groups).filter(function (g) { return g !== "path_start" && g !== "path_end"; });
    return names.length > 2 && names.every(function (g) {
      return groups[g].length === 1 && groups[g][0] === g;
    });
  }

  // The point shown last is the current one, until the closing paragraph.
  function syncGraphSwitcher(slide) {
    if (!slide || !slide.classList.contains("slide-graph-switch")) return;
    var current = null;
    slide.querySelectorAll("li.switch-point").forEach(function (li) {
      li.classList.remove("switch-current");
      if (li.classList.contains("visible")) current = li;
    });
    // Once the closing paragraph is up, no point is the current one.
    var close = slide.querySelector(".graph-switch-close");
    if (close && close.classList.contains("visible")) current = null;
    if (current) current.classList.add("switch-current");
  }

  // ── Slide: Idea: one visit, one event ─────────────────────────────────────
  // The figure (toy.py visits_as_events_figure) builds up a row per click,
  // fragments 0, 1, 2; the first point goes with its first row, each next
  // point is the click that brings up the next row.
  function buildVisitsIdea(slide) {
    var points = slide.querySelectorAll(":scope > ul > li");
    Array.prototype.forEach.call(points, function (li, i) {
      if (i === 0) return;
      li.classList.add("fragment");
      li.dataset.fragmentIndex = i - 1;
    });
  }

  // ── Slide: A tree hides what the graph shows ──────────────────────────────
  // Each point is a click that spotlights its transition (`a` → `b`, read as
  // the stories are) on the tree, the sunburst and the icicle: every segment
  // of `b` right after `a` (toy.py branching_figure's data-event and
  // data-parent), the rest faded.
  function buildTreeSpot(slide) {
    slide.querySelectorAll(":scope > ul > li").forEach(function (li) {
      li.classList.add("fragment", "tree-spot");
      li.querySelectorAll("code").forEach(function (code) {
        code.classList.add("chip");
        code.dataset.visit = code.textContent;
      });
    });
  }

  function syncTreeSpot(slide) {
    if (!slide || !slide.classList.contains("slide-tree-spot")) return;
    var current = null;
    slide.querySelectorAll("li.tree-spot").forEach(function (li) {
      if (li.classList.contains("visible")) current = li;
    });
    var edges = current ? storyWalk(current).edges : [];
    slide.querySelectorAll(".branching svg").forEach(function (svg) {
      svg.classList.toggle("spot-on", edges.length > 0);
      svg.querySelectorAll("[data-event]").forEach(function (el) {
        var hit = edges.some(function (e) {
          return el.dataset.parent === e[0] && el.dataset.event === e[1];
        });
        el.classList.toggle("spot-hit", hit);
      });
    });
  }

  // ── Slides: Through the funnel, and back / Digging deeper: a loop ─────────
  // A graph on the left; on the right, the slide's other widget if it has one
  // (a step matrix), and the points. The graph highlights the walk in the
  // first point (`teamwork` → `solo`, `view_timeline` → `view_timeline`), the
  // same way the Part 1 stories do; with `zoom`, it zooms in on the walk
  // (a loop on one node in a graph of 31 events), otherwise it fits the graph.
  function graphAndPoints(zoom) {
    return function (slide) { buildGraphAndPoints(slide, zoom); };
  }

  function buildGraphAndPoints(slide, zoom) {
    var cells = slide.querySelectorAll(":scope > .cell");
    var list = slide.querySelector(":scope > ul");
    var layout = document.createElement("div");
    layout.className = "graph-points-layout";
    cells[0].before(layout);
    var side = document.createElement("div");
    side.className = "graph-points-side";
    layout.appendChild(cells[0]);
    layout.appendChild(side);
    if (cells[1]) side.appendChild(cells[1]);
    side.appendChild(list);
    colorDiffGroups(slide);
    // The story: the first point that walks the graph (`a` → `b`); its
    // events become chips.
    var story = Array.prototype.find.call(list.children, function (li) {
      return storyWalk(li).edges.length > 0;
    }) || list.children[0];
    story.querySelectorAll("code").forEach(function (code) {
      code.classList.add("chip");
      code.dataset.visit = code.textContent;
    });
    var graph = cells[0].querySelector("iframe[srcdoc]");
    graph.addEventListener("load", function () {
      whenGraphReady(graph, function (cy) {
        // Zoomed, the padding keeps some of the graph around the walk in view.
        var on = highlightStory(cy, story);
        if (zoom) cy.fit(on.nodes(), 110);
        else cy.fit(undefined, 20);
      });
    });
  }

  // ── Theme conventions ──────────────────────────────────────────────────────
  function applyThemeConventions() {
    var sectionBg = getComputedStyle(document.documentElement).getPropertyValue("--section-bg").trim();
    document.querySelectorAll(".reveal .slides section.level1").forEach(function (s) {
      if (sectionBg) s.setAttribute("data-background-color", sectionBg);
    });

    document.querySelectorAll(".reveal .slides section.level2").forEach(function (s) {
      if (SLIDES[s.id]) return;
      if (s.querySelector(":scope > h3")) s.classList.add("center", "question-slide");
    });

    // `## 2.1 Title` alone on a slide → subsection divider, number set apart.
    document.querySelectorAll(".reveal .slides section.level2").forEach(function (s) {
      var h2 = s.querySelector(":scope > h2");
      var m = h2 && h2.textContent.trim().match(/^(\d+\.\d+)\s+(.+)$/);
      var content = Array.prototype.filter.call(s.children, function (el) {
        return el !== h2 && !el.matches("aside");
      });
      if (!m || content.length) return;
      s.classList.add("center", "subsection-slide");
      h2.innerHTML = '<span class="subsection-number"></span> <span></span>';
      h2.firstChild.textContent = m[1];
      h2.lastChild.textContent = m[2];
    });

    document.querySelectorAll(".reveal .slides section.level2 > p").forEach(function (p) {
      if (p.textContent.trim() !== ROADMAP) return;
      p.classList.add("map");
      p.innerHTML = ROADMAP.split(" · ").map(function (step) {
        var on = Array.prototype.some.call(p.querySelectorAll("strong"), function (b) {
          return b.textContent.trim() === step;
        });
        return '<span class="' + (on ? "on" : "") + '">' + step + "</span>";
      }).join("");
    });
  }

  function applySlideIllustrations() {
    addTitlePhotos();
    Object.keys(SLIDES).forEach(function (id) {
      var slide = document.getElementById(id);
      if (!slide) {
        console.warn("deck.html: no slide with id '" + id + "' (was its title renamed?)");
        return;
      }
      SLIDES[id].cls.split(" ").forEach(function (c) { slide.classList.add(c); });
      // One slide's builder failing (say, its markdown changed shape) must
      // not leave every slide after it unbuilt.
      try {
        if (SLIDES[id].build) SLIDES[id].build(slide);
      } catch (err) {
        console.error("deck.html: building slide '" + id + "' failed", err);
      }
    });
  }

  // Static widgets are iframes that lay themselves out once, on load. Reveal
  // loads every slide up front, so a widget on a slide (or fragment) that isn't
  // on screen yet fits its graph to the wrong viewport. Reload each widget the
  // first time it actually becomes visible.
  // Reveal scales the whole slide up to the screen, but a graph's canvas
  // inside the iframe is drawn for the iframe's unscaled size, so on a big
  // screen it comes out blurry. Cytoscape sizes its canvas by
  // devicePixelRatio, so the reloaded iframe reports one that includes the
  // slide's scale (and at least 3, in case the window grows later).
  // A slide can also hand a widget extra CSS (`data-widget-css` on the iframe),
  // e.g. to override the widget's own inline sizes with !important.
  function withPixelRatio(srcdoc, css) {
    var ratio = Math.max(3, Math.ceil((window.devicePixelRatio || 1) * Reveal.getScale()));
    var patch = "<script>Object.defineProperty(window, 'devicePixelRatio', { get: function () { return " +
      ratio + "; } });<\/script>";
    if (css) patch += "<style>" + css + "</style>";
    return srcdoc.indexOf(patch) >= 0 ? srcdoc : srcdoc.replace("<head>", "<head>" + patch);
  }

  function refitWidgets(slide) {
    if (!slide) return;
    slide.querySelectorAll("iframe[srcdoc]").forEach(function (f) {
      if (f.dataset.refitted || f.closest(".fragment:not(.visible)")) return;
      reloadWidget(f);
    });
    // An exported report (an iframe with a src) lays out its graphs once too.
    slide.querySelectorAll("iframe.report-frame").forEach(function (f) {
      if (f.dataset.refitted) return;
      f.dataset.refitted = "1";
      f.src = f.getAttribute("src");
    });
  }

  function onReady() {
    applySlideIllustrations();
    applyThemeConventions();
    Reveal.sync();
    Reveal.layout();
    refitWidgets(Reveal.getCurrentSlide());
    layoutColumnFrames(Reveal.getCurrentSlide());
    syncGraphSwitcher(Reveal.getCurrentSlide());
  }

  // Export mode (export.py opens slides.html?export): still frames, so no
  // transitions and no controls (custom.scss).
  if (/[?&]export\b/.test(location.search)) {
    document.documentElement.classList.add("export-mode");
    Reveal.configure({ transition: "none", backgroundTransition: "none", controls: false, progress: false });
  }

  if (Reveal.isReady()) onReady(); else Reveal.on("ready", onReady);

  // Served by serve.py (./render.sh preview): reload once a new render lands.
  // Anywhere else /__mtime doesn't exist and the first failed poll stops this.
  if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
    var seen = null;
    (function poll() {
      fetch("/__mtime", { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw r; return r.json(); })
        .then(function (d) {
          if (seen !== null && d.mtime !== seen) location.reload();
          seen = d.mtime;
          setTimeout(poll, 1500);
        })
        .catch(function () {});
    })();
  }
  Reveal.on("slidechanged", function (e) {
    syncClusterSpots(e.currentSlide);
    syncPairsSpot(e.currentSlide);
    syncFunnelSpots(e.currentSlide);
    syncTreeSpot(e.currentSlide);
    syncTreeGraphSpot(e.currentSlide);
    syncGraphSwitcher(e.currentSlide);
    syncVisitsSlide(e.currentSlide);
    refitWidgets(e.currentSlide);
    layoutColumnFrames(e.currentSlide);
  });
  Reveal.on("fragmentshown", function () {
    syncClusterSpots(Reveal.getCurrentSlide());
    syncPairsSpot(Reveal.getCurrentSlide());
    syncVisitsSlide(Reveal.getCurrentSlide());
    syncTreeSpot(Reveal.getCurrentSlide());
    syncTreeGraphSpot(Reveal.getCurrentSlide());
    syncGraphSwitcher(Reveal.getCurrentSlide());
    refitWidgets(Reveal.getCurrentSlide());
    syncFunnelSpots(Reveal.getCurrentSlide());
  });
  Reveal.on("fragmenthidden", function () {
    syncClusterSpots(Reveal.getCurrentSlide());
    syncPairsSpot(Reveal.getCurrentSlide());
    syncVisitsSlide(Reveal.getCurrentSlide());
    syncTreeSpot(Reveal.getCurrentSlide());
    syncTreeGraphSpot(Reveal.getCurrentSlide());
    syncGraphSwitcher(Reveal.getCurrentSlide());
    syncFunnelSpots(Reveal.getCurrentSlide());
  });
  Reveal.on("resize", function () { layoutColumnFrames(Reveal.getCurrentSlide()); });
  if (document.fonts) {
    document.fonts.ready.then(function () { layoutColumnFrames(Reveal.getCurrentSlide()); });
  }
})();
</script>
