name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-min-pandas-duckdb:
    # A focused lower-bound check, not another full/latest-dependency matrix.
    # Keep unrelated dependencies locked so their releases cannot break it.
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install the locked supporting dependencies
        run: >-
          uv sync --frozen
          --no-install-package pandas --no-install-package duckdb
          --no-install-package numpy --no-install-package scipy
      - name: Install minimum pandas and DuckDB
        # pandas 2.2.0 wheels need the NumPy 1.x ABI; SciPy 1.18 needs NumPy 2.
        run: uv pip install "pandas==2.2.0" "duckdb==1.1.0" "numpy==1.26.4" "scipy==1.17.1"
      - run: uv pip check
      - name: Test calendar operations without resyncing the lock
        run: >-
          uv run --no-sync pytest
          tests/engine/
          tests/data_processors/to_daily_states_test.py
          tests/metrics/metric_builder_test.py -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # setup-uv@v3 has no python-version input, so without this uv falls
      # back to the runner's system interpreter (CPython 3.14 on the current
      # ubuntu-latest image, for which gensim has no wheel).
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: js/package-lock.json

      - name: Install JS dependencies
        working-directory: js
        run: npm ci

      - name: Build JS
        run: |
          npm run build --prefix js/viz-core
          npm run build --prefix js/widget

      - name: Run JS tests
        run: npm test --prefix js/widget

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Install Chromium for widget rendering tests
        if: matrix.python-version == '3.12'
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Run widget rendering tests
        if: matrix.python-version == '3.12'
        run: uv run --with playwright pytest tests/browser -v
